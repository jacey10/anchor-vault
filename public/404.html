<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting to Anchor Vault</title>
    <script>
      (function () {
        var base = '/anchor-vault';
        var path = window.location.pathname;

        if (path === base || path === base + '/') {
          window.location.replace(base + '/');
          return;
        }

        var route = path.startsWith(base + '/')
          ? path.slice(base.length)
          : path;

        var redirect = route + window.location.search + window.location.hash;

        sessionStorage.setItem('anchor-vault-redirect', redirect);
        window.location.replace(base + '/');
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to Anchor Vault...</p>
  </body>
</html>
